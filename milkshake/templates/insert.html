{% extends "base.html" %}
{% block titulo %}<title>Milkshake</title>{% endblock %}
{% block content %}
<div>
    <h1>Cadastrar Milkshake</h1>
    <form action="{{ url_for('insert_milk') }}" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br>
        <label for="sabor">Sabor:</label>
        <input type="text" id="sabor" name="sabor" required><br>
        <label for="cobertura">Cobertura:</label>
        <input type="text" id="cobertura" name="cobertura" required><br>
        <label for="confeitos">Confeitos:</label>
        <input type="text" id="confeitos" name="confeitos" required><br>
        <label for="tamanho">Tamanho:</label>
        <input type="text" id="tamanho" name="tamanho" required><br>
        <label for="preco">Preço:</label>
        <input type="text" id="preco" name="preco" required><br>
        <button type="submit">Cadastrar</button>
    </form>
</div>
{% endblock %}
